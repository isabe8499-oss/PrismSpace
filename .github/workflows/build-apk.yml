name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

jobs:
  build:
    name: Compile Portuguese (Brazil) APK
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuração
        run: ./gradlew --no-daemon --max-workers=2 :assembly:assembleCompleteNormalDebug

      - name: Disponibilizar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PrismSpace-pt-BR-debug
          path: assembly/build/outputs/apk/completeNormal/debug/assembly-complete-normal-debug.apk
          if-no-files-found: error
          retention-days: 14
